<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFBEB;
  --surface:#FFFFFF;
  --ink:#1C2B20;
  --muted:#818C7E;
  --green:#5C8F42;
  --green-d:#456B32;
  --green-l:#D6E3D0;
  --lime:#E8C97A;
  --accent-l:#D8EDF5;
  --walkin:#98DBF5;
  --tag-green:#80CA5A;
  --brand:#5C8F42;
  --brand-d:#456B32;
  --brand-l:#D8EDF5;
  --line:#EFE9D2;
  --logo-green:#5C8F42;
  --logo-cream:#FFFCF0;
  --shadow:0 20px 40px -22px rgba(21,79,53,.18);
  --shadow-sm:0 10px 22px -14px rgba(21,79,53,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{touch-action:manipulation;}
body{
  font-family:'Poppins',sans-serif;
  background:#E8DFC7;
  min-height:100vh;
  display:flex;justify-content:center;align-items:flex-start;
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}
.display{font-family:'Poppins',sans-serif;}
.eyebrow{font-size:11px;letter-spacing:.02em;font-weight:700;color:var(--green);text-transform:uppercase;}
.brand-mark{width:14px;height:13px;color:var(--logo-green);}
.brand-mark.light{color:var(--green);width:16px;height:15px;}
.brand-mark.light .logo-hole{fill:rgba(255,255,255,.55);}

/* ---- app shell (standalone) ---- */
.shell{
  width:100%;max-width:430px;min-height:100vh;
  background:var(--bg);position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
@media(min-width:431px){ .shell{min-height:900px;margin:24px 0;border-radius:36px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);} }

.content{flex:1;padding:16px 18px 108px;animation:fadeUp .25s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.content::-webkit-scrollbar{display:none;}

h1.page-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:23px;margin:4px 0 2px;line-height:1.2;}
.subline{font-size:12.5px;color:var(--muted);margin:0 0 16px;}

/* ---- top bar ---- */
.topbar{padding:20px 18px 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:6;}
.hi{display:flex;align-items:center;gap:11px;}
.avatar{
  width:53px;height:52px;border-radius:50%;background:var(--green);color:#fff;border:1px solid #000;
  display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:32px;cursor:pointer;
}
.hi-text .g{font-size:11.5px;color:var(--muted);}
.hi-text .n{display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
.hi-text .n b{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;}
.member-badge{background:#FFE79A;color:#8A6A00;font-size:9px;font-weight:800;padding:3px 9px;border-radius:100px;letter-spacing:.04em;}
.bell{width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.bell .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#C97B4A;border:1.5px solid var(--surface);}
.bell svg{width:17px;height:17px;stroke:var(--ink);}
.back-btn{
  width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.back-btn svg{width:16px;height:16px;stroke:var(--ink);}

/* ---- search bar ---- */
.searchbar{
  display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;
  height:41px;padding:0 15px;box-sizing:border-box;
  box-shadow:var(--shadow-sm);margin-bottom:8px;
}
.searchbar svg{width:17px;height:17px;stroke:var(--muted);flex:0 0 auto;}
.searchbar input{border:none;outline:none;background:none;font-family:'Poppins';font-size:13.5px;flex:1;color:var(--ink);}
.searchbar .fbtn{width:30px;height:30px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;}
.searchbar .fbtn svg{width:15px;height:15px;stroke:#fff;}

/* ---- category pill row ---- */
.cat-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-pill{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
}
.cat-pill .ci{
  width:52px;height:52px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;
}
.cat-pill.active .ci{background:var(--green);}
.cat-pill .ci svg{width:22px;height:22px;stroke:var(--green);}
.cat-pill.active .ci svg{stroke:#fff;}
.cat-pill .cl{font-size:10.5px;font-weight:700;color:var(--muted);}

/* ---- primary shortcuts hub (Grab-style entry icons, 2x2 for bigger tap targets) ---- */
.hub-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:0 0 8px;}
.hub-item{
  display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--surface);border-radius:14px;
  height:58px;padding:0 10px;box-sizing:border-box;box-shadow:var(--shadow-sm);transition:transform .12s ease;
}
.hub-item:active{transform:scale(.96);}
.hub-item .hi{width:32px;height:32px;border-radius:50%;background:var(--accent-l);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.hub-item .hi svg{width:15px;height:15px;stroke:var(--green);stroke-width:2;}
.hub-item.accent .hi{background:var(--brand);}
.hub-item span{font-size:11.5px;font-weight:700;color:var(--ink);text-align:left;line-height:1.25;}
.hub-item .hub-sub{font-size:9.5px;font-weight:700;color:var(--muted);margin-top:1px;}
.mini-avatar-stack{display:flex;align-items:center;flex:0 0 auto;}
.mini-avatar-stack .ma{width:22px;height:22px;border-radius:50%;background:var(--accent-l);color:var(--green);font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);margin-left:-7px;}
.mini-avatar-stack .ma:first-child{margin-left:0;}
.hub-item.friends .hi{width:32px;height:32px;padding:0;}

/* ---- promo banner ---- */
.promo-banner{background:var(--green);border-radius:14px;height:50px;padding:0 13px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;margin-bottom:8px;box-shadow:var(--shadow-sm);border:1px solid #1D1D1F;}
.promo-banner .pt{font-family:'Poppins',sans-serif;font-weight:800;font-size:13px;color:#fff;}
.promo-banner .ps{font-size:11.5px;color:#fff;margin-top:2px;line-height:1.5;}
.promo-banner .ps b{color:#fff;}

/* ---- peak-hours chart ---- */
.chart-card{margin-bottom:0;}
.chart-head{margin-bottom:4px;}
.chart-head .ct{font-weight:700;font-size:13.5px;}
.chart-wrap{position:relative;padding-top:20px;padding-bottom:16px;}
.peak-label{position:absolute;top:0;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;}
.people-label{position:absolute;bottom:0;font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap;}
.chart-bars{display:flex;align-items:flex-end;gap:2px;height:45px;}
.chart-bars .bar{flex:1;border-radius:2px 2px 0 0;background:#D9D9D9;}
.chart-bars .bar.mid{background:#DDEBD8;}
.chart-bars .bar.peak{background:var(--green);}

/* ---- my bookings list ---- */
.book-card{background:#fff;border:1.5px solid #000;border-radius:18px;padding:14px 15px;margin-bottom:10px;}
.book-row{display:flex;align-items:center;justify-content:space-between;}
.book-row + .book-row{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(58,42,26,.18);}
.book-info b{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:#3A2A10;display:block;}
.book-info span{font-size:10.5px;color:#0071E3;}
.book-actions{display:flex;gap:6px;flex:0 0 auto;}
.book-pill{padding:7px 11px;border-radius:100px;font-size:10.5px;font-weight:700;cursor:pointer;border:none;}
.book-pill.ci{background:var(--green);color:#fff;}
.book-pill.dt{background:#fff;color:#19352B;border:1.5px solid var(--green);}

/* ---- popular grid 3+2 with photo tiles ---- */
.pop32{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:9px;}
.pop32-row2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
.photo-tile{
  border-radius:16px;overflow:hidden;position:relative;aspect-ratio:1/1.05;cursor:pointer;box-shadow:var(--shadow-sm);
}
.photo-tile svg{width:100%;height:100%;display:block;}
.photo-tile img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-tile .pt-badge{position:absolute;top:7px;right:7px;background:rgba(255,255,255,.92);color:#161617;font-size:8.5px;font-weight:800;padding:5px 8px;border-radius:100px;letter-spacing:.03em;}
.photo-tile .pt-label{position:absolute;left:8px;bottom:8px;color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;text-shadow:0 2px 6px rgba(0,0,0,.5);z-index:2;}
.photo-tile:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%);z-index:1;}

/* ---- activity grid (explore page) ---- */
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.act-tile{border-radius:18px;overflow:hidden;position:relative;aspect-ratio:1/0.92;cursor:pointer;box-shadow:var(--shadow-sm);}
.act-tile svg{width:100%;height:100%;display:block;}
.act-tile img{width:100%;height:100%;object-fit:cover;display:block;}
.act-tile:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(19,42,28,.78) 100%);z-index:1;}
.act-tile:after{content:"";position:absolute;inset:0;background:rgba(21,79,53,.22);mix-blend-mode:multiply;z-index:1;pointer-events:none;}
.act-tile.walk:after{background:rgba(182,90,42,.24);}
.act-info{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;}
.act-info .an2{color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:13.5px;line-height:1.2;}
.act-info .ath{color:#fff;font-size:10px;margin-top:2px;}
.act-tag{display:inline-block;margin-top:7px;font-size:8.5px;font-weight:700;padding:4px 9px;border-radius:100px;letter-spacing:.03em;}
.act-tag.book{background:var(--tag-green);color:#000000;}
.act-tag.walk{background:var(--walkin);color:#000000;}
.act-rating{position:absolute;top:9px;left:9px;background:#fff;color:#000000;font-size:9.5px;font-weight:700;
  padding:3px 7px;border-radius:100px;display:flex;align-items:center;gap:3px;z-index:2;}
.act-rating svg{width:9px;height:9px;fill:#F5C453;stroke:none;}

/* ---- reviews section (venue detail) ---- */
.rating-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.rating-row .rs{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;}
.rating-row .rs svg{width:15px;height:15px;fill:#F5C453;stroke:none;}
.rating-row .rc{font-size:11.5px;color:var(--muted);}
.review-card{background:var(--surface);border-radius:16px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.review-card .rn{font-weight:700;font-size:12.5px;}
.review-card .rstars{display:flex;gap:1px;margin:3px 0 6px;}
.review-card .rstars svg{width:11px;height:11px;fill:#F5C453;stroke:none;}
.review-card .rt{font-size:12px;color:#3a4238;line-height:1.5;}

/* ---- trainer roster (Personal Training) ---- */
.trainer-card{
  display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px;
  margin-bottom:10px;box-shadow:var(--shadow-sm);cursor:pointer;border:1px solid #000000;
}
.trainer-card.sel{border-color:#2c4a36;background:var(--accent-l);}
.trainer-card .tav{width:46px;height:46px;border-radius:14px;background:var(--green);
  color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:600;font-size:16px;flex:0 0 auto;}
.trainer-card .tinfo{flex:1;}
.trainer-card .tn{font-weight:600;font-size:13.5px;}
.trainer-card .tsp{font-size:11px;color:var(--muted);margin-top:1px;}
.trainer-card .tr{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink);margin-top:4px;}
.trainer-card .tr svg{width:11px;height:11px;fill:#F5C453;stroke:none;}
.trainer-card .tgo{flex:0 0 auto;color:var(--muted);}
.trainer-card .tgo svg{width:16px;height:16px;stroke:var(--muted);}

/* ---- profile: membership stats + account list ---- */
.plan-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;
  padding:13px 15px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.plan-row .pn{font-weight:700;font-size:12.5px;}
.plan-row .pd{font-size:10.5px;color:var(--muted);margin-top:2px;}
.plan-row .pbtn{background:var(--green);color:#fff;border:none;padding:8px 13px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px;}
.stat-tile{background:var(--surface);border-radius:16px;padding:13px 8px;text-align:center;box-shadow:var(--shadow-sm);}
.stat-tile b{font-family:'Poppins',sans-serif;font-weight:800;font-size:19px;display:block;color:var(--ink);}
.stat-tile span{font-size:9.5px;color:var(--muted);font-weight:700;}
.acct-list{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);margin-top:6px;}
.acct-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;}
.acct-row svg:last-child{width:16px;height:16px;stroke:var(--muted);flex:0 0 auto;}
.acct-row:last-child{border-bottom:none;}
.acct-row .ai{width:32px;height:32px;border-radius:10px;background:#F1FFF3;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.acct-row .ai svg{width:15px;height:15px;stroke:#000000;}
.acct-row span{flex:1;font-size:12.5px;font-weight:700;}
.acct-row > svg{width:15px;height:15px;stroke:var(--muted);flex:0 0 auto;}

/* ---- notifications feed ---- */
.notif-item{display:flex;gap:12px;background:var(--surface);border-radius:16px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.notif-item.unread{border-left:4px solid var(--green);}
.notif-icon{width:38px;height:38px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.notif-icon svg{width:18px;height:18px;stroke:#fff;}
.notif-icon.blue{background:var(--accent-l);}
.notif-icon.blue svg{stroke:var(--green-d);}
.notif-info{flex:1;}
.notif-info .nt{font-weight:700;font-size:12.5px;color:#1a3040;}
.notif-info .nd{font-size:11.5px;color:#8fa8b8;margin-top:2px;line-height:1.4;}
.notif-info .ntime{font-size:10px;color:#8fa8b8;margin-top:5px;}


/* ---- membership packages: full page, premium cards ---- */
.pkg-card{background:var(--surface);border-radius:26px;overflow:hidden;margin-bottom:2px;box-shadow:var(--shadow);position:relative;}
.pkg-card-head{background-color:var(--pc);background-image:linear-gradient(135deg,rgba(255,255,255,.2),rgba(0,0,0,.1));padding:22px 20px 20px;color:#fff;position:relative;overflow:hidden;}
.pkg-card-head:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);}
.pkg-pop-ribbon{position:absolute;top:14px;right:-32px;background:rgba(255,255,255,.25);color:#fff;font-size:10px;font-weight:700;
  padding:4px 36px;transform:rotate(35deg);letter-spacing:.03em;z-index:2;}
.pkg-current-badge{display:inline-block;background:#fff;color:var(--ink);font-size:11px;font-weight:700;
  padding:8px 13px;border-radius:100px;margin-bottom:8px;position:relative;z-index:1;}
.pkg-icon2{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin-bottom:12px;position:relative;z-index:1;}
.pkg-icon2 svg{width:22px;height:22px;stroke:#fff;}
.pkg-name2{font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;position:relative;z-index:1;}
.pkg-tag2{font-size:11px;color:#fff;margin-top:2px;position:relative;z-index:1;}
.pkg-price2{margin-top:16px;position:relative;z-index:1;}
.pkg-was{font-size:11.5px;color:#fff;text-decoration:line-through;display:block;margin-bottom:2px;}
.pkg-price2 > div{display:flex;align-items:baseline;gap:4px;}
.pkg-price2 b{font-family:'Poppins',sans-serif;font-weight:800;font-size:25px;}
.pkg-price2 span{font-size:11.5px;color:#fff;}
.pkg-save{margin-top:9px;font-size:10px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);
  display:inline-block;padding:5px 11px;border-radius:100px;position:relative;z-index:1;}
.pkg-card-body{padding:8px 20px 20px;}
.pkg-card-body>.pkg-perks:last-child{margin-bottom:0;}
.pkg-perks{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.perk{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center;}
.perk .pi{width:38px;height:38px;border-radius:12px;background:var(--pt);display:flex;align-items:center;justify-content:center;}
.perk .pi svg{width:17px;height:17px;stroke:var(--pc);}
.perk span{font-size:9px;font-weight:700;color:var(--ink);line-height:1.25;}
.perk-plus{font-size:15px;color:#161617;font-weight:400;flex:0 0 auto;padding-top:8px;}
.acct-row.danger .ai{background:#FFE4E4;}
.acct-row.danger .ai svg{stroke:#C23B3B;}
.acct-row.danger span{color:#FF3333;}

/* ---- fitness hub ---- */
.fit-hero{background:var(--surface);border-radius:24px;padding:9px 20px;color:#000;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);}
.fit-hero:after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:var(--accent-l);opacity:.5;}
.fit-hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.fit-streak{display:flex;align-items:center;gap:6px;background:#161617;padding:6px 12px;border-radius:100px;}
.fit-streak svg{width:14px;height:14px;stroke:#F5C453;fill:#F5C453;}
.fit-streak span{font-size:12px;font-weight:700;color:#fff;}
.fit-week{display:flex;gap:7px;margin:16px 0 18px;position:relative;z-index:1;}
.fit-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
.fit-day .fd{width:100%;aspect-ratio:1;border-radius:9px;background:#424245;display:flex;align-items:center;justify-content:center;}
.fit-day .fd.done{background:var(--accent-l);}
.fit-day .fd.done svg{width:13px;height:13px;stroke:#000;}
.fit-day span{font-size:8.5px;color:#161617;}
.fit-cta{background:var(--green);color:#fff;border:none;border-radius:16px;padding:14px;width:100%;font-family:'Poppins',sans-serif;
  font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;position:relative;z-index:1;}
.fit-cta svg{width:16px;height:16px;stroke:#fff;fill:#fff;}
.muscle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px;}
.muscle-tile{background:var(--surface);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--shadow-sm);cursor:pointer;}
.muscle-tile .mi{width:34px;height:34px;border-radius:10px;background:var(--surface);border:1.3px solid #E3E3E3;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;}
.muscle-tile .mi svg{width:16px;height:16px;stroke:#000000;}
.muscle-tile b{font-size:12px;font-weight:700;display:block;}
.muscle-tile span{font-size:9px;color:var(--muted);}
.pr-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;}
.pr-row::-webkit-scrollbar{display:none;}
.pr-card{flex:0 0 auto;width:130px;background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm);}
.pr-card .prn{font-size:11px;color:var(--muted);font-weight:700;}
.pr-card .prv{font-family:'Poppins',sans-serif;font-weight:800;font-size:19px;margin-top:4px;}
.pr-card .prt{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:10.5px;color:var(--green-d);font-weight:700;}
.pr-card .prt svg{width:11px;height:11px;stroke:var(--green-d);}
.log-item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.log-item .li-date{width:52px;flex:0 0 auto;font-size:10px;color:var(--muted);font-weight:700;}
.log-item .li-info{flex:1;}
.log-item .li-name{font-weight:700;font-size:12.5px;}
.log-item .li-meta{font-size:10.5px;color:var(--muted);margin-top:2px;}

/* ---- fitness sub-tab bar (feed / routines / stats) ---- */
.fit-tabbar{display:flex;gap:6px;background:var(--accent-l);border-radius:100px;padding:5px;margin-bottom:18px;}
.ft-btn{flex:1;text-align:center;padding:10px 4px;border-radius:100px;font-size:12px;font-weight:700;color:#1b2e20;cursor:pointer;}
.ft-btn.active{background:var(--green);color:#fff;}

/* ---- feed cards (Hevy-style) ---- */
.feed-card{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.feed-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.feed-avatar{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;flex:0 0 auto;}
.feed-head .fn{font-weight:700;font-size:13px;}
.feed-head .fd{font-size:10.5px;color:var(--muted);}
.feed-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:17px;margin-bottom:10px;}
.feed-stats{display:flex;gap:22px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.feed-stats div{display:flex;flex-direction:column;}
.feed-stats span{font-size:10px;color:#4d4d4d;}
.feed-stats div:nth-child(2) span{color:#000;}
.feed-stats div:nth-child(2) b{font-size:15px;}
.feed-stats b{font-size:13.5px;margin-top:2px;}
.feed-stats .rec{display:flex;align-items:center;gap:4px;}
.feed-stats .rec svg{width:13px;height:13px;fill:#FFB347;stroke:none;}
.fex-row{display:flex;align-items:center;gap:11px;margin-bottom:10px;}
.fex-icon{width:36px;height:36px;border-radius:50%;background:var(--accent-l);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.fex-icon svg{width:16px;height:16px;stroke:#000000;}
.fex-row span{font-size:12.5px;font-weight:700;}
.fex-more{font-size:11.5px;color:var(--muted);text-align:center;padding:6px 0;cursor:pointer;font-weight:700;}
.feed-actions{display:flex;gap:20px;padding-top:12px;border-top:1px solid var(--line);}
.feed-actions .fa-btn{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:600;user-select:none;}
.feed-actions .fa-btn svg{width:17px;height:17px;stroke:var(--muted);transition:transform .12s ease;}
.feed-actions .fa-btn:active svg{transform:scale(.85);}
.feed-actions .fa-btn.liked{color:var(--green-d);}
.feed-actions .fa-btn.liked svg{stroke:var(--green-d);fill:var(--green-d);}
.feed-comments{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.feed-comment-row{display:flex;gap:8px;margin-bottom:8px;font-size:12.5px;}
.feed-comment-row .fcn{font-weight:700;flex:0 0 auto;}
.feed-comment-row .fct{color:var(--ink);}
.feed-comment-input{display:flex;gap:8px;align-items:center;margin-top:4px;}
.feed-comment-input input{flex:1;border:1.5px solid var(--line);border-radius:100px;padding:8px 14px;font-size:12.5px;font-family:'Poppins',sans-serif;background:var(--bg);}
.feed-comment-input button{border:none;background:var(--green);color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
.feed-comment-input button svg{width:14px;height:14px;stroke:#fff;}

/* ---- routines ---- */
.routine-cta{background:var(--green);color:#fff;border:none;border-radius:16px;padding:15px;width:100%;
  font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.routine-cta svg{width:17px;height:17px;stroke:#fff;}
.routine-quick{display:flex;gap:10px;margin-bottom:18px;}
.rq-btn{flex:1;background:var(--surface);border-radius:14px;padding:13px;text-align:center;box-shadow:var(--shadow-sm);cursor:pointer;}
.rq-btn svg{width:18px;height:18px;stroke:var(--green-d);margin-bottom:6px;}
.rq-btn span{display:block;font-size:12px;font-weight:700;}
.routine-card{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.routine-card .rn{font-family:'Poppins',sans-serif;font-weight:800;font-size:15.5px;margin-bottom:5px;}
.routine-card .rp{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:13px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.routine-start{background:var(--green);color:#fff;border:none;border-radius:12px;padding:13px 11px;width:100%;font-weight:700;font-size:12.5px;cursor:pointer;}

/* ---- stats dashboard ---- */
.stat-week{font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;margin-bottom:14px;}
.stat-week span{font-size:12px;color:var(--muted);font-weight:400;}
.chart-metric-row{display:flex;gap:8px;margin:14px 0 18px;}
.cm-btn{flex:1;text-align:center;padding:10px 4px;border-radius:100px;font-size:11.5px;font-weight:700;background:#E4EDE3;color:#1b2e20;cursor:pointer;}
.cm-btn.active{background:var(--green);color:#fff;}
.cm-btn.stat-cm-btn:not(.active){background:#F1FFF3;}
.week-chart{display:flex;align-items:flex-end;gap:4px;height:110px;margin-bottom:6px;background:var(--surface);border-radius:16px;padding:14px 10px;box-shadow:var(--shadow-sm);}
.week-chart .wc-bar{flex:1;background:var(--accent-l);border-radius:3px 3px 0 0;min-height:3px;}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;}
.dash-tile{background:var(--surface);border-radius:16px;padding:15px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-sm);cursor:pointer;}
.dash-tile svg{width:18px;height:18px;stroke:var(--green-d);flex:0 0 auto;}
.dash-tile span{font-size:12.5px;font-weight:700;}

/* ---- workout/routine detail pages ---- */
.detail-hero2{background:var(--accent-l);border-radius:22px;padding:20px;color:#000;margin-bottom:18px;}
.detail-hero2 .dh-name{font-family:'Poppins',sans-serif;font-weight:800;font-size:21px;color:#000;}
.detail-hero2 .dh-date{font-size:11.5px;color:#333;margin-top:2px;}
.detail-hero2 .dh-stats{display:flex;gap:24px;margin-top:16px;}
.detail-hero2 .dh-stats div{display:flex;flex-direction:column;}
.detail-hero2 .dh-stats span{font-size:10px;color:#333;}
.detail-hero2 .dh-stats b{font-size:15px;margin-top:2px;color:#000;}
.wd-hero .dh-date{color:#161617;}
.wd-hero .dh-stats span{color:#161617;}
.wd-hero .dh-stats b{color:#161617;}
.rd-hero{margin-bottom:12px;}
.rd-hero .dh-name{color:#161617;}
.rd-hero .dh-date{color:#161617;}
.mg-inline .mi{background:var(--accent-l);border:none;}
.exlib-grid .mi{background:var(--accent-l);border:none;}
.exlib-grid .muscle-tile{padding:8px 14px;}
.set-table{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.set-table .stn{font-weight:700;font-size:13.5px;margin-bottom:10px;}
.set-row{display:flex;align-items:center;padding:7px 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line);}
.set-row:first-of-type{border-top:none;}
.set-row .sc{width:44px;flex:0 0 auto;font-weight:700;color:var(--ink);}
.set-row .sv{flex:1;}
.rt-target{background:#F1FFF3;color:#1B2E20;border-radius:100px;padding:4px 10px;font-size:10.5px;font-weight:700;}

/* ---- active session ---- */
.session-timer{text-align:center;padding:20px 0 16px;}
.session-timer .st-num{font-family:'Poppins',sans-serif;font-weight:800;font-size:38px;color:#1B2E20;}
.session-timer .st-lbl{font-size:11px;color:var(--muted);}
.sess-ex-card{background:var(--surface);border-radius:18px;padding:15px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.sess-ex-card .sen{font-weight:700;font-size:13.5px;margin-bottom:10px;}
.sess-set{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);}
.sess-set:first-of-type{border-top:none;}
.sess-set .ssn{width:24px;font-size:11px;color:var(--muted);font-weight:700;}
.sess-set .sst{flex:1;font-size:12.5px;color:var(--ink);}
.sess-check{width:26px;height:26px;border-radius:8px;border:1.6px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
.sess-check.done{background:var(--green);border-color:var(--green);}
.sess-check svg{width:14px;height:14px;stroke:#fff;}
.finish-btn{background:var(--green);color:#fff;border:none;border-radius:16px;padding:15px 16px;width:100%;font-weight:700;
  font-size:14px;cursor:pointer;margin-top:9px;box-shadow:var(--shadow-sm);}

/* ---- exercise library / detail ---- */
.ex-row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:14px 20px;margin-bottom:9px;box-shadow:var(--shadow-sm);cursor:pointer;}
.ex-row svg:last-child{width:16px;height:16px;stroke:var(--muted);flex:0 0 auto;}
.ex-row .exi{width:34px;height:34px;border-radius:10px;background:var(--accent-l);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.ex-row .exi svg{width:16px;height:16px;stroke:#000000;}
.ex-row .ex-txt{flex:1;min-width:0;}
.ex-row .ex-txt .exn{font-size:12.5px;font-weight:600;display:block;}
.ex-row .ex-txt .exeq{font-size:10.5px;color:var(--muted);margin-top:1px;display:block;}
.ex-row > svg{width:15px;height:15px;stroke:var(--muted);flex:0 0 auto;}
.ex-detail-hero{text-align:center;padding:10px 0 6px;}
.ex-detail-hero .edi{width:64px;height:64px;border-radius:20px;background:var(--accent-l);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.ex-detail-hero .edi svg{width:28px;height:28px;stroke:#000000;}
.ex-detail-eq{display:inline-block;background:var(--accent-l);color:var(--green-d);font-size:10.5px;font-weight:700;padding:5px 12px;border-radius:100px;margin:0 auto 14px;}
.ex-detail-instr{font-size:12.5px;line-height:1.7;color:#333;background:var(--surface);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow-sm);}

/* ---- calendar ---- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow-sm);}
.cal-dow{text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding-bottom:6px;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:11.5px;font-weight:600;color:var(--ink);}
.cal-day.done{background:var(--accent-l);color:#fff;font-weight:700;}

/* ---- statistics summary ---- */
.stat-sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.stat-sum-tile{background:var(--surface);border-radius:16px;padding:15px;box-shadow:var(--shadow-sm);}
.stat-sum-tile b{font-family:'Poppins',sans-serif;font-weight:800;font-size:19px;display:block;color:#1b2e20;margin-bottom:6px;}
.stat-sum-tile span{font-size:10.5px;color:var(--muted);}

/* ---- body measures ---- */
.weight-hero{background:var(--accent-l);border-radius:22px;padding:20px;color:#000;margin-bottom:16px;}
.weight-hero .wh-num{font-family:'Poppins',sans-serif;font-weight:800;font-size:32px;color:#161617;}
.weight-hero .wh-lbl{font-size:11.5px;color:#161617;margin-top:2px;}
.weight-hero .wh-trend{margin-top:12px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);
  padding:5px 11px;border-radius:100px;font-size:11px;font-weight:700;color:#161617;}
.weight-hero .wh-trend svg{width:12px;height:12px;stroke:#161617;}
.add-measure-btn{background:var(--green);color:#fff;border:none;border-radius:14px;padding:13px;width:100%;font-weight:700;
  font-size:13px;cursor:pointer;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:8px;}
.add-measure-btn svg{width:15px;height:15px;stroke:#fff;}
.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px;}
.measure-tile{background:var(--surface);border-radius:14px;padding:13px;box-shadow:var(--shadow-sm);}
.measure-tile b{font-size:14px;font-weight:700;display:block;margin-bottom:6px;}
.measure-tile span{font-size:10.5px;color:var(--muted);}
.weight-log-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:14px;
  padding:12px 15px;margin-bottom:8px;box-shadow:var(--shadow-sm);}
.weight-log-row .wl-date{font-size:11.5px;color:var(--muted);}
.weight-log-row .wl-val{font-weight:700;font-size:13.5px;}

/* ---- friends here now ---- */
.fh-row{display:flex;align-items:center;gap:13px;background:var(--surface);border-radius:18px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.fh-row .fha{width:46px;height:46px;border-radius:14px;background-size:cover;background-position:center;color:#000;font-family:'Poppins',sans-serif;
  font-weight:700;font-size:16px;display:flex;align-items:flex-end;justify-content:flex-end;flex:0 0 auto;position:relative;overflow:hidden;}
.fh-row .fha .fha-badge{width:19px;height:19px;border-radius:50%;background:var(--green);color:#fff;font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);margin:3px;}
.fh-row .fha:after{content:"";position:absolute;bottom:0;right:0;width:0;height:0;}
.fh-row .fhi{flex:1;}
.fh-row .fhn{font-weight:700;font-size:13.5px;}
.fh-row .fhd{font-size:11px;color:var(--muted);margin-top:1px;}
.fh-wave{background:var(--green);color:#fff;border:none;border-radius:100px;padding:10px 14px;font-size:11.5px;font-weight:700;cursor:pointer;flex:0 0 auto;}
.fh-row .fhi{cursor:pointer;}

/* ---- post-squad form ---- */
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:7px;}
.form-field input,.form-field textarea,.form-field select{
  width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  font-family:'Poppins';font-size:13px;color:var(--ink);box-shadow:var(--shadow-sm);box-sizing:border-box;
}
.form-field textarea{resize:vertical;min-height:70px;}
.sport-toggle{display:flex;gap:8px;}
.sp-btn{flex:1;text-align:center;padding:11px 4px;border-radius:12px;font-size:12.5px;font-weight:700;background:var(--surface);
  border:1.5px solid var(--line);color:var(--muted);cursor:pointer;}
.sp-btn.active{background:var(--green);color:#fff;border-color:var(--green);}
.sport-photo-tile{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;aspect-ratio:1/0.85;box-shadow:var(--shadow-sm);border:2px solid transparent;}
.sport-photo-tile img,.sport-photo-tile svg{width:100%;height:100%;object-fit:cover;display:block;}
.sport-photo-tile:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.62) 100%);}
.sport-photo-tile span{position:absolute;left:8px;right:8px;bottom:7px;color:#fff;font-size:10.5px;font-weight:700;line-height:1.2;z-index:1;}
.sport-photo-tile.sel{border-color:#fff;box-shadow:0 0 0 3px var(--green);}

/* ---- friend chat ---- */
.chat-thread{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.chat-bubble{max-width:75%;padding:11px 14px;border-radius:16px;font-size:13px;line-height:1.5;}
.chat-bubble.them{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow-sm);border-bottom-left-radius:5px;}
.chat-bubble.me{align-self:flex-end;background:var(--accent-l);border-bottom-right-radius:5px;}
.chat-input-row{display:flex;gap:8px;position:sticky;bottom:8px;}
.chat-input-row input{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:100px;padding:12px 16px;
  font-family:'Poppins';font-size:13px;box-shadow:var(--shadow-sm);box-sizing:border-box;}
.chat-send{width:44px;height:44px;border-radius:50%;background:var(--brand);border:none;display:flex;align-items:center;
  justify-content:center;cursor:pointer;flex:0 0 auto;box-shadow:var(--shadow-sm);}
.chat-send svg{width:18px;height:18px;stroke:#fff;}

/* ---- referral / invite friends ---- */
.ref-code-panel{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:18px;padding:16px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
.ref-code-panel .rcl{font-size:10.5px;color:var(--muted);font-weight:700;}
.ref-code-panel .rcv{font-family:'Poppins',sans-serif;font-weight:800;font-size:17px;color:var(--ink);margin-top:2px;}
.ref-share-btn{background:var(--green);color:#fff;border:none;border-radius:100px;padding:11px 16px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
.ref-share-btn svg{width:14px;height:14px;stroke:#fff;}
.ref-progress-row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:10px;}
.ref-tier-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px;}
.ref-tier{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;}
.rt-icon{width:44px;height:44px;border-radius:50%;background:#F1FFF3;display:flex;align-items:center;justify-content:center;}
.rt-icon svg{width:19px;height:19px;stroke:#9A9A9A;}
.rt-icon.done{background:var(--green);}
.rt-icon.done svg{stroke:#fff;}
.ref-tier:last-child .rt-icon:not(.done){background:#E4EDE3;}
.ref-tier span{font-size:10px;font-weight:700;color:var(--muted);}
.ref-tier.done span{color:var(--ink);}
.ref-credit-card{background:var(--accent-l);border-radius:18px;padding:18px;margin-bottom:16px;}
.ref-credit-card .rc-num{font-family:'Poppins',sans-serif;font-weight:800;font-size:26px;color:#fff;}
.ref-credit-card .rc-lbl{font-size:11.5px;color:var(--ink);margin-top:2px;}
.ref-note{font-size:10.5px;color:var(--muted);line-height:1.6;}

/* ---- payment methods ---- */
.pm-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:14px;padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.pm-row .pm-name{font-size:13px;font-weight:600;}
.pm-badge{background:var(--accent-l);color:#000000;font-size:9.5px;font-weight:700;padding:5px 9px;border-radius:100px;}
.faq-list .ai{background:var(--accent-l);}
.cat-pill.active .cl{color:var(--green);}

/* ---- hero photo card ---- */
.hero-card{
  border-radius:26px;padding:20px;position:relative;overflow:hidden;margin-bottom:18px;min-height:190px;
  background:linear-gradient(160deg,#7DA568 0%, #456B32 100%);color:#fff;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);
}
.hero-card:before{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(207,238,124,.12);}
.hero-card:after{content:"";position:absolute;left:-30px;bottom:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06);}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.hero-badge{background:var(--lime);color:var(--green-d);font-size:10.5px;font-weight:700;padding:6px 12px;border-radius:100px;}
.hero-heart{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;}
.hero-heart svg{width:15px;height:15px;stroke:#fff;}
.hero-bottom{position:relative;z-index:1;}
.hero-bottom h2{margin:0 0 4px;font-family:'Poppins',sans-serif;font-size:19px;font-weight:700;}
.hero-bottom .hm{font-size:11.5px;color:rgba(255,255,255,.75);margin-bottom:14px;}
.hero-chips{display:flex;gap:8px;}
.hero-chip{background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:12px;padding:8px 12px;font-size:11px;display:flex;align-items:center;gap:6px;}
.hero-chip svg{width:13px;height:13px;stroke:var(--lime);}

/* ---- section header ---- */
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px;}
.sec-title h3{font-size:15px;font-weight:700;margin:0;font-family:'Poppins',sans-serif;}
.sec-title a{font-size:11.5px;color:var(--green);font-weight:700;cursor:pointer;}

/* ---- recommend banner (quiz CTA) ---- */
.quiz-banner{
  display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:14px;
  height:50px;padding:0 11px;box-sizing:border-box;
  box-shadow:var(--shadow-sm);margin-bottom:16px;cursor:pointer;border:1px solid #000;
}
.quiz-banner .qi{width:32px;height:32px;border-radius:50%;background:var(--accent-l);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.quiz-banner .qi svg{width:22px;height:22px;stroke:#000000;}
.quiz-banner .qt{flex:1;}
.quiz-banner .qt b{font-family:'Poppins',sans-serif;font-size:13.5px;display:block;color:#000000;}
.quiz-banner .qt span{font-size:11px;color:#1C2B20;}
.quiz-banner .qgo{width:30px;height:30px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.quiz-banner .qgo svg{width:14px;height:14px;stroke:#fff;}
.venue-quiz-banner{background:var(--green);padding:17px 15px;}
.venue-quiz-banner .qi{border-radius:14px;}
.venue-quiz-banner .qt b{color:#ffffff;}
.venue-quiz-banner .qt span{color:#ffffff;}
.venue-quiz-banner .qgo{background:#ffffff;}
.venue-quiz-banner .qgo svg{stroke:var(--green);}
.invite-banner{background:var(--accent-l);}
.invite-banner .qi{background:#FAFAFC;}

/* ---- 2-col popular grid (photo cards) ---- */
.pop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pop-card{
  border-radius:20px;padding:14px;cursor:pointer;position:relative;overflow:hidden;min-height:150px;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-sm);color:#fff;
}
.pop-card:before{content:"";position:absolute;right:-24px;bottom:-24px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08);}
.pop-card .pi{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}
.pop-card .pi svg{width:17px;height:17px;stroke:#fff;}
.pop-card .pn{font-family:'Poppins',sans-serif;font-weight:700;font-size:12.5px;position:relative;z-index:1;line-height:1.25;margin-top:10px;}
.pop-card .badge2{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);color:var(--green-d);font-size:8.5px;font-weight:800;padding:4px 8px;border-radius:100px;z-index:1;text-transform:uppercase;}

/* ---- venue list rows (explore) ---- */
.vrow{
  display:flex;align-items:center;gap:13px;background:var(--surface);border-radius:18px;
  padding:12px 13px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-sm);
}
.vrow .vicon-wrap{width:44px;height:44px;border-radius:14px;background:var(--green-l);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.vrow .vicon-wrap svg{width:20px;height:20px;stroke:var(--green);}
.vrow .vinfo{flex:1;}
.vrow .vname{font-weight:700;font-size:13.5px;}
.vrow .vnameth{font-size:10.5px;color:var(--muted);margin-top:1px;}
.badge{font-size:9px;font-weight:700;padding:5px 9px;border-radius:100px;flex:0 0 auto;text-transform:uppercase;}
.badge.book{background:var(--tag-green);color:#000000;}
.badge.walk{background:var(--walkin);color:#000000;}

/* ---- venue hero / detail ---- */
.venue-hero{border-radius:24px;padding:22px 18px;margin-bottom:16px;position:relative;overflow:hidden;
  background:linear-gradient(155deg,#7DA568,#456B32);background-size:cover;background-position:center;color:#fff;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;}
.venue-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,25,12,.08),rgba(10,16,8,.6));}
.venue-hero .vh-badge{position:relative;z-index:1;align-self:flex-start;margin-bottom:auto;}
.venue-hero h1{margin:0;font-size:20px;font-family:'Poppins',sans-serif;font-weight:800;position:relative;z-index:1;}
.venue-hero p{margin:2px 0 0;font-size:11.5px;color:rgba(255,255,255,.85);position:relative;z-index:1;}
.desc-box{font-size:13.5px;line-height:1.65;color:#3a2e22;margin-bottom:18px;}
.desc-box.venue-desc{color:#3a2e22;}

/* time picker */
.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.tp-pill{background:var(--surface);border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow-sm);}
.tp-pill .t{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;}
.tp-pill .s{font-size:10.5px;color:var(--muted);margin-top:2px;}
.tp-pill.peak .t{color:var(--brand);}
.tp-pill.full{opacity:.4;pointer-events:none;}
.tp-pill.selected{background:var(--accent-l);}
.tp-pill.selected .s{color:var(--ink);}
.detail-panel{background:var(--surface);border-radius:18px;padding:15px;margin-bottom:18px;animation:fadeUp .2s ease;}
.detail-panel .dn{font-weight:700;font-size:14px;}
.detail-panel .dc{font-size:11.5px;color:var(--ink);margin-top:2px;margin-bottom:11px;}
.spots-bar{width:100%;height:6px;border-radius:3px;background:#E8DFC2;overflow:hidden;margin-bottom:4px;}
.spots-bar span{display:block;height:100%;background:var(--green);}
.spots-txt{font-size:10.5px;color:var(--muted);}

.btn{border:none;border-radius:16px;padding:14px 16px;font-family:'Poppins',sans-serif;font-weight:700;
  font-size:13.5px;cursor:pointer;text-align:center;flex:0 0 auto;transition:transform .12s ease;}
.btn:active{transform:scale(.97);}
.btn-green{background:var(--green);color:#fff;box-shadow:0 12px 22px -10px rgba(28,43,32,.4);}
.btn-green:disabled{background:#D8CFB4;color:#8A8270;box-shadow:none;}
.btn-outline{background:var(--surface);border:1.5px solid var(--line);color:var(--ink);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-block{width:100%;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

/* occupancy (walk-in) */
.occ-card{background:var(--surface);border-radius:20px;padding:29px 20px;text-align:center;box-shadow:var(--shadow-sm);}
.occ-card .eyebrow{font-weight:600;color:#2c4a36;}
.occ-ring{width:104px;height:104px;border-radius:50%;margin:8px auto 14px;position:relative;
  background:conic-gradient(var(--green) 0deg 194deg, var(--line) 194deg 360deg);display:flex;align-items:center;justify-content:center;}
.occ-ring .inner{width:80px;height:80px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.occ-ring .inner b{font-family:'Poppins',sans-serif;font-size:20px;}
.occ-ring .inner span{font-size:9px;color:var(--muted);}

/* confirm */
.confirm-card{background:var(--surface);border-radius:22px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.confirm-photo{height:90px;background:linear-gradient(135deg,#7DA568,#456B32);background-size:cover;background-position:center;}
.confirm-body{padding:16px;}
.confirm-body h2{margin:0 0 4px;font-size:16px;font-family:'Poppins',sans-serif;font-weight:800;}
.confirm-body .row{display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0;border-top:1px dashed var(--line);color:#3a2e22;}
.confirm-body .row b{color:var(--ink);font-weight:600;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;
  padding:14px;margin-bottom:14px;font-size:13px;box-shadow:var(--shadow-sm);}
.switch{width:40px;height:23px;border-radius:100px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;}
.switch.on{background:var(--green);}
.switch i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.18s;}
.switch.on i{left:20px;}
.note{font-size:11px;color:var(--muted);text-align:center;margin:14px 0;line-height:1.6;}

/* success */
.success-wrap{text-align:center;padding:26px 8px 8px;}
.ok-circle{width:76px;height:76px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 14px 30px -12px rgba(30,110,74,.6);}
.ok-circle svg{width:32px;height:32px;stroke:#fff;}

/* journal */
.filter-scroll{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;}
.filter-scroll::-webkit-scrollbar{display:none;}
.f-chip{flex:0 0 auto;padding:8px 14px;border-radius:100px;font-size:11.5px;font-weight:700;background:var(--surface);
  box-shadow:var(--shadow-sm);cursor:pointer;color:var(--green);}
.f-chip.active{background:var(--green);color:#fff;}
.jrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;
  padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.jrow.booked{box-shadow:inset 0 0 0 1px var(--green);}
.jtime{font-weight:700;font-size:12.5px;width:44px;flex:0 0 auto;color:var(--muted);}
.jrow.booked .jtime{color:var(--green);}
.jinfo{flex:1;}
.jn{font-weight:700;font-size:13px;}
.jm{font-size:10.5px;color:var(--muted);}
.mini-btn{padding:7px 12px;font-size:11px;font-weight:700;border-radius:10px;border:none;cursor:pointer;background:var(--green);color:#fff;flex:0 0 auto;}
.mini-btn.done{background:var(--accent-l);color:var(--green);}
.mini-btn.book{background:var(--lime);color:var(--green-d);}

/* member card */
.member-card{background:var(--accent-l);border-radius:26px;padding:22px;margin-bottom:18px;
  position:relative;overflow:hidden;box-shadow:var(--shadow);}
.member-card:after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:#4E7A38;}
.member-card .mtier{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--green);}
.member-card h2{margin:5px 0 18px;font-size:19px;font-family:'Poppins',sans-serif;font-weight:800;}
.member-card .mnum{font-size:12px;color:var(--ink);}
.qr-box{background:#fff;border-radius:20px;padding:16px;display:flex;justify-content:center;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.qr-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;width:158px;height:158px;}
.qr-grid i{background:var(--ink);border-radius:1px;}
.qr-grid i.off{background:transparent;}

/* cafe */
.cat-title2{font-weight:700;font-size:12px;color:#2c4a36;margin:18px 0 8px;}
.zone-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;}
.zone-scroll::-webkit-scrollbar{display:none;}
.zone-chip{flex:0 0 auto;padding:9px 14px;border-radius:100px;font-size:12px;font-weight:700;background:var(--surface);
  box-shadow:var(--shadow-sm);cursor:pointer;}
.zone-chip.sel{background:var(--brand);color:#fff;}
.cart-bar{position:sticky;bottom:86px;margin:0 16px;background:var(--green);color:#fff;border-radius:20px;
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 16px 32px -14px rgba(28,43,32,.4);cursor:pointer;z-index:9;}
.discount-banner{display:flex;align-items:center;gap:10px;background:var(--green-l);border-radius:14px;padding:12px 14px;margin:10px 0 4px;box-shadow:var(--shadow-sm);}
.discount-banner svg{width:18px;height:18px;stroke:var(--green-d);flex:0 0 auto;}
.discount-banner span{font-size:11.5px;font-weight:600;color:var(--green-d);}
.irprice-orig{color:var(--muted);font-weight:500;margin-right:4px;text-decoration:line-through;}
/* cafe: ot-btn scoped to café order-type toggle (distinct from Find Friends toggle, which keeps the base look) */
.order-toggle.cafe-ot{background:var(--accent-l);}
.order-toggle.cafe-ot .ot-btn{background:transparent;color:#1b2e20;}
.order-toggle.cafe-ot .ot-btn.active{background:var(--brand);color:#fafafc;}
/* cafe: ok-circle scoped to café order-confirmed success icon (distinct from booking-confirmed, which keeps the base look) */
.ok-circle.cafe-ok{background:var(--accent-l);}
.ok-circle.cafe-ok svg{stroke:var(--green-d);}
.irprice-disc{color:var(--green-d);}
/* fitness session overhaul */
.session-empty{text-align:center;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-sm);padding:34px 20px;margin-top:14px;}
.session-empty .se-icon{width:52px;height:52px;border-radius:16px;background:var(--green-l);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.session-empty .se-icon svg{width:24px;height:24px;stroke:var(--green-d);}
.session-empty p{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0 0 16px;}
.session-empty p b{color:var(--ink);font-size:14px;}
.sess-ex-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.sess-ex-icon{width:34px;height:34px;border-radius:10px;background:var(--green-l);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.sess-ex-icon svg{width:16px;height:16px;stroke:var(--green-d);}
.sess-ex-head .sen{flex:1;}
.sess-menu-wrap{position:relative;flex:0 0 auto;}
.sess-menu-btn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);cursor:pointer;font-size:16px;}
.sess-menu-btn:hover{background:var(--green-l);}
.sess-menu{position:absolute;right:0;top:32px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);z-index:20;min-width:160px;overflow:hidden;}
.sess-menu div{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12px;cursor:pointer;white-space:nowrap;}
.sess-menu div:hover{background:var(--green-l);}
.sess-menu svg{width:14px;height:14px;stroke:var(--muted);}
.sess-set-header{display:grid;grid-template-columns:26px 1fr 52px 52px 30px;gap:6px;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;padding:0 2px 4px;}
.sess-set-row{display:grid;grid-template-columns:26px 1fr 52px 52px 30px;gap:6px;align-items:center;padding:4px 2px;}
.sess-set-row .ssn{font-weight:700;font-size:12px;text-align:center;}
.sess-set-row .ssp{font-size:11px;color:var(--muted);text-align:center;cursor:pointer;}
.sess-set-row .ssi{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;font-family:'Poppins',sans-serif;font-size:12px;background:var(--bg);}
.sess-add-set{font-size:11.5px;font-weight:700;color:var(--green-d);text-align:center;padding:8px;cursor:pointer;}
.sess-notes{width:100%;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-family:'Poppins',sans-serif;font-size:11.5px;background:var(--bg);margin-top:4px;}
.rb-name-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:'Poppins',sans-serif;font-size:13px;background:var(--surface);margin-bottom:6px;}
.rb-ex-row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-sm);padding:10px 12px;margin-bottom:8px;}
.rb-ex-info{flex:1;}
.rb-ex-name{font-size:12.5px;font-weight:600;margin-bottom:6px;}
.rb-ex-targets{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.rb-ex-targets input{border:1px solid var(--line);border-radius:8px;padding:5px;text-align:center;font-family:'Poppins',sans-serif;font-size:11px;background:var(--bg);}
.rb-ex-targets input[type=number]{width:38px;}
.rb-ex-targets input[type=text]{width:48px;}
.rb-ex-remove{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;flex:0 0 auto;}
.rb-ex-row .exi{width:34px;height:34px;border-radius:10px;background:var(--accent-l);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.rb-ex-row .exi svg{width:16px;height:16px;stroke:#000000;}
.sess-add-set svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px;}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px;}
.cart-bar b{font-family:'Poppins',sans-serif;font-size:13px;}
.cart-bar span{font-size:11px;color:#C9DCC9;}

/* café sidebar-rail layout (Chatramue-style) */
.cafe-split{display:flex;gap:0;margin:0 -18px;}
.cafe-rail{width:76px;flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:4px 8px 20px;}
.cafe-rail-item{
  display:flex;flex-direction:column;align-items:center;gap:4.5px;padding:10px 4px;border-radius:14px;cursor:pointer;
}
.cafe-rail-item .ri{width:40px;height:40px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;}
.cafe-rail-item .ri svg{width:18px;height:18px;stroke:var(--green);}
.cafe-rail-item.active .ri{background:var(--brand);}
.cafe-rail-item.active .ri svg{stroke:#fff;}
.cafe-rail-item span{font-size:9.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.2;}
.cafe-rail-item.active span{color:var(--brand);}
.cafe-items{flex:1;min-width:0;padding:4px 18px 20px 10px;}
.item-card{background:var(--surface);border-radius:18px;padding:10px;margin-bottom:10px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;}
.item-photo{width:100%;aspect-ratio:1.3/1;border-radius:12px;overflow:hidden;margin-bottom:8px;}
.item-photo svg{width:100%;height:100%;display:block;}
.item-card .iname{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;}
.item-card .itag{font-size:10px;color:var(--muted);margin-top:2px;}
.item-card .ikcal{font-size:9.5px;color:var(--green-d);font-weight:700;margin-top:4px;display:flex;align-items:center;gap:3px;}
.item-card .ikcal svg{width:9px;height:9px;stroke:var(--green-d);}

/* ---- pickup/delivery toggle (Chatramue "Pick Up At" style) ---- */
.order-toggle{display:flex;gap:5px;background:var(--green);border-radius:14px;padding:5px;margin-bottom:12px;}
.ot-btn{flex:1;text-align:center;padding:10px 4px;border-radius:11px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;}
.ot-btn svg{width:14px;height:14px;stroke:currentColor;}
.ot-btn.active{background:var(--surface);box-shadow:var(--shadow-sm);color:var(--green-d);}
.pickup-note{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:4px;box-shadow:var(--shadow-sm);}
.pickup-note .pn-icon{width:34px;height:34px;border-radius:10px;background:var(--accent-l);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.pickup-note .pn-icon svg{width:16px;height:16px;stroke:var(--green-d);}
.pickup-note b{font-size:12px;display:block;}
.pickup-note span{font-size:10.5px;color:var(--muted);}

/* ---- Chatramue-style horizontal product row ---- */
.item-row{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.item-row .irphoto{width:62px;height:62px;border-radius:12px;overflow:hidden;flex:0 0 auto;}
.item-row .irphoto svg{width:100%;height:100%;display:block;}
.item-row .irinfo{flex:1;min-width:0;}
.item-row .irname{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;}
.item-row .irtag{font-size:10px;color:var(--muted);margin-top:1px;}
.item-row .irbottom{display:flex;align-items:center;gap:8px;margin-top:5px;}
.item-row .irprice{font-size:12.5px;color:var(--brand);font-weight:700;}
.item-row .irkcal{font-size:9px;color:#1b2e20;font-weight:700;display:flex;align-items:center;gap:2px;}
.item-row .irkcal svg{width:8px;height:8px;stroke:var(--green-d);}
.item-row .qty-ctrl{flex:0 0 auto;}
.item-card .irow{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.item-card .iprice{font-size:12.5px;color:var(--brand);font-weight:800;}
.qty-ctrl{display:flex;align-items:center;gap:9px;}
.qty-btn{width:25px;height:25px;border-radius:8px;border:none;background:#e4ede3;font-size:14px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#2c4a36;font-weight:700;}
.qty-btn.plus{background:var(--brand);color:#fff;}
.qty-num{min-width:14px;text-align:center;font-size:12.5px;font-weight:700;}


/* ---- quiz ---- */
.quiz-progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:6px;}
.quiz-progress span{display:block;height:100%;background:var(--green);transition:width .25s ease;}
.quiz-step{font-size:11px;color:var(--muted);margin-bottom:18px;}
.quiz-q{font-family:'Poppins',sans-serif;font-weight:700;font-size:23px;margin-bottom:18px;line-height:1.115;}
.q-opt{
  display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:14px 15px;
  margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-sm);border:1px solid #000000;
}
.q-opt.sel{background:var(--accent-l);}
.q-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.q-opt.sel .q-radio{border-color:var(--green);}
.q-radio i{width:10px;height:10px;border-radius:50%;background:var(--green);display:none;}
.q-opt.sel .q-radio i{display:block;}
.q-opt span{font-size:13.5px;font-weight:600;}
.result-hero{border-radius:24px;padding:22px;margin-bottom:18px;position:relative;overflow:hidden;
  background:var(--accent-l);color:#000;text-align:center;}
.result-hero .rtag{font-size:16px;color:#161617;font-weight:600;letter-spacing:.04em;}
.result-hero h2{margin:8px 0 4px;font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;color:#161617;}
.result-hero p{font-size:12px;color:#161617;font-weight:600;margin:0;}
.match-icon{width:64px;height:64px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.match-icon svg{width:28px;height:28px;stroke:var(--green);}

/* ---- squad finder ---- */
.squad-card{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.squad-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.squad-sport{font-family:'Poppins',sans-serif;font-weight:800;font-size:14.5px;}
.squad-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.squad-spots{background:#E4EDE3;color:#2c4a36;font-size:10.5px;font-weight:700;padding:6px 10px;border-radius:100px;flex:0 0 auto;}
.squad-spots.full{background:#FFE4E4;color:#C23B3B;}
.avatar-stack{display:flex;align-items:center;margin-bottom:12px;}
.avatar-stack .as{width:28px;height:28px;border-radius:50%;background:var(--accent-l);color:#000;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);margin-left:-8px;}
.avatar-stack .as:first-child{margin-left:0;}
.avatar-stack .an{font-size:11px;color:var(--muted);margin-left:8px;}
.squad-note{font-size:12px;color:#3a2e22;margin-bottom:12px;line-height:1.5;}
.post-card{background:var(--accent-l);border:1.5px dashed #0071e3;border-radius:20px;padding:18px;text-align:center;margin-bottom:14px;cursor:pointer;}
.post-card svg{width:24px;height:24px;stroke:#000000;margin-bottom:8px;}
.post-card b{display:block;font-family:'Poppins',sans-serif;font-size:13.5px;}
.post-card span{font-size:11px;color:var(--muted);}

/* ---- bottom nav (labeled, colored — Chatramue-style) ---- */
.navbar{position:sticky;bottom:0;left:0;right:0;z-index:10;}
.navbar-inner{
  background:var(--accent-l);display:flex;align-items:flex-end;justify-content:space-around;
  padding:10px 4px 20px;position:relative;
}
.nav-btn{
  border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  color:#000;flex:1;padding:2px 2px;transition:transform .18s ease;
}
.nb-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .18s ease;}
.nb-icon svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;}
.nav-btn span{font-size:10.5px;font-weight:600;margin-top:1px;color:#000;}
/* active tab morphs into the raised white bubble, Figma-style — icon/label stay dark, the bubble+shadow is the only cue */
.nav-btn.active{color:#000;}
.nav-btn.active span{font-weight:800;color:#000;}
.nav-btn.active .nb-icon{
  width:58px;height:58px;background:#FFFDF6;box-shadow:0 0 0 6px var(--accent-l),0 8px 16px -6px rgba(28,43,32,.4);
  margin-top:-28px;
}
.nav-btn.active .nb-icon svg{width:25px;height:25px;stroke:#000;stroke-width:2;}

.toast{
  position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:100px;font-size:12px;font-weight:600;box-shadow:var(--shadow);
  animation:toastIn .25s ease, toastOut .3s ease 1.9s forwards;z-index:30;white-space:nowrap;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0}}

/* ---- onboarding: splash + login ---- */
.onb-splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;cursor:pointer;}
.onb-splash .onb-logo{width:127px;height:119px;color:var(--logo-green);margin-bottom:18px;}
.onb-splash .onb-word{font-family:'Poppins',sans-serif;font-weight:700;font-size:48px;color:var(--logo-green);letter-spacing:.01em;}
.onb-splash .onb-tag{font-size:20px;font-weight:600;letter-spacing:.14em;color:#1C2B20;margin-top:6px;}
.onb-splash .onb-hint{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);}
.onb-login{flex:1;padding:34px 26px 26px;display:flex;flex-direction:column;justify-content:center;}
.onb-login .onb-logo-sm{width:84px;height:84px;color:var(--logo-green);margin:0 auto 10px;display:block;}
.onb-login .onb-word-sm{text-align:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:36px;color:var(--logo-green);margin-bottom:16px;}
.onb-toggle{display:flex;gap:12px;justify-content:center;margin-bottom:20px;}
.onb-toggle button{padding:9px 22px;border-radius:100px;font-family:'Poppins',sans-serif;font-weight:700;font-size:12.5px;cursor:pointer;border:1.5px solid var(--green);background:var(--surface);color:#333;}
.onb-toggle button.active{background:var(--green);color:#fff;border-color:var(--green);}
.onb-login h1{font-family:'Poppins',sans-serif;font-weight:600;font-size:32px;line-height:22px;color:#19352b;margin:0 0 4px;text-align:center;}
.onb-login .onb-sub{font-size:14px;font-weight:400;color:#132018;text-align:center;margin-bottom:20px;}
.onb-login .btn-block{margin-top:6px;}
.onb-login .btn-green{border-radius:8px;border:1px solid #2c2c2c;padding:12px 12px;box-shadow:none;}
.onb-login .form-field label{margin-bottom:8px;}
.onb-login .onb-foot{text-align:center;font-size:14px;color:#0e3e3e;margin-top:14px;}
.onb-login .onb-foot a{color:var(--green-d);font-weight:700;cursor:pointer;}
.onb-forgot{float:right;font-size:14px;color:#093030;font-weight:600;cursor:pointer;}
</style>

/* quiz */
function startQuiz(){ pushBack(); state.quizStep=0; state.quizAnswers=[]; state.quizResult=null; state.view='quiz'; render(); }
function answerQuiz(optIds){
  state.quizAnswers[state.quizStep]=optIds;
  if(state.quizStep < quizQuestions.length-1){
    state.quizStep++;
  } else {
    const score={};
    state.quizAnswers.forEach(ids=>ids.forEach(id=>{ score[id]=(score[id]||0)+1; }));
    let best=null,bestScore=-1;
    Object.entries(score).forEach(([id,s])=>{ if(s>bestScore && venueById(id)){ best=id; bestScore=s; } });
    state.quizResult = best || 'group';
    pushBack();
    state.view='quizResult';
  }
  render();
}
function prevQuizStep(){
  if(state.quizStep>0){ state.quizStep--; render(); } else { go('today'); }
}

// Builds a randomized peak-hours bar chart: 24 bars spanning 06:00-22:00 (40 min/bar),
// with a random 2-hour peak window each time this is called so the chart isn't static.
function buildPeakChart(){
  const BARS = 24, OPEN_H = 6, CLOSE_H = 22, PEAK_LEN = 3;
  const peakStart = 3 + Math.floor(Math.random()*(BARS-PEAK_LEN-6));
  const bars = [];
  for(let i=0;i<BARS;i++){
    let h, tier;
    if(i>=peakStart && i<peakStart+PEAK_LEN){ h=100; tier='peak'; }
    else if(i===peakStart-1){ h=57; tier='mid'; }
    else if(i===peakStart+PEAK_LEN){ h=75; tier='mid'; }
    else if(i===peakStart+PEAK_LEN+1){ h=64; tier='mid'; }
    else { h=18+Math.round(Math.random()*14); tier='low'; }
    bars.push({h,tier});
  }
  const minutesPerBar = (CLOSE_H-OPEN_H)*60/BARS;
  const fmt = m=>{const h=Math.floor(m/60), mm=Math.round(m%60); return `${String(h).padStart(2,'0')}.${String(mm).padStart(2,'0')}`;};
  const startMin = OPEN_H*60 + peakStart*minutesPerBar;
  const endMin = OPEN_H*60 + (peakStart+PEAK_LEN)*minutesPerBar;
  const centerPct = ((peakStart+PEAK_LEN/2)/BARS)*100;
  const people = 28 + Math.floor(Math.random()*33); // 28-60 people during the peak window
  return {bars, label:`${fmt(startMin)}-${fmt(endMin)}`, centerPct, people};
}

function viewCheckinCode(){
  const it = state.checkinTarget;
  if(!it) return topbar(true) + `<div class="content"></div>` + navbar();
  let cells='';
  for(let i=0;i<81;i++){
    const on = ((i*13+7) % 5 !== 0) && ((i*7+i*i) % 4 !== 0 || i%9===0);
    cells += `<i class="${on?'':'off'}"></i>`;

  const code = String(Math.abs((it.name+it.time).split('').reduce((a,c)=>a*31+c.charCodeAt(0),7)) % 900000 + 100000);
  return topbar(true) + `<div class="content">

function viewOrderHistory(){

function viewPaymentMethods(){

function viewHelp(){

  ];

    <h1 class="page-title">ช่วยเหลือ</h1>
    <p class="subline">คำถามที่พบบ่อย หรือติดต่อทีมงาน</p>
    <div class="acct-list faq-list">
      ${faqs.map(q=>`<div class="acct-row" onclick="showToast('เปิดคำตอบ (เดโม)')"><div class="ai">${ic('help')}</div><span>${q}</span>${ic('chevron')}</div>`).join('')}
    </div>
    <button class="btn btn-block btn-green" style="margin-top:16px" onclick="showToast('เปิดแชทกับทีมงาน (เดโม)')">แชทกับทีมงาน SABAI</button>
  </div>` + navbar();
}

function viewCard(){
  let cells='';
  for(let i=0;i<81;i++){
    const on = ((i*13+7) % 5 !== 0) && ((i*7+i*i) % 4 !== 0 || i%9===0);
    cells += `<i class="${on?'':'off'}"></i>`;
  }
  const acctLinks = [
    ['receipt','ประวัติการสั่งซื้อคาเฟ่','orderHistory'],
    ['wallet','วิธีการชำระเงิน','paymentMethods'],
    ['settings','ตั้งค่าบัญชี','accountSettings'],
    ['help','ช่วยเหลือ','help'],
  ];
  const myPlan = PACKAGES.find(p=>p.id===state.currentPlanId);
  return topbar(false) + `<div class="content">
    <div class="member-card">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">${ic('logo','brand-mark light')}<span class="mtier eyebrow">SABAI · ${myPlan.name.toUpperCase()} MEMBER</span></div>
      <h2>${state.userName}</h2>
      <div class="mnum">SABAI-4820-71</div>
    </div>
    <div class="sec-title" style="margin-top:2px"><h3>QR Code แสกนเข้าร้าน</h3></div>
    <div class="qr-box"><div class="qr-grid">${cells}</div></div>
    <p class="note" style="margin-top:0">ใช้สแกนที่เครื่องอ่านหน้าประตู หรือแสดงให้พนักงานที่เคาน์เตอร์</p>

    <div class="sec-title"><h3>สมาชิกของฉัน</h3></div>
    <div class="plan-row">
      <div><div class="pn">${myPlan.name}</div><div class="pd">ใช้ได้ถึง 31 ธ.ค. 2569</div></div>
      <button class="pbtn" onclick="go('renewPackages')">ต่ออายุ</button>
    </div>

    <div class="stat-row">
      <div class="stat-tile"><b>12</b><span>เช็คอินเดือนนี้</span></div>
      <div class="stat-tile" style="cursor:pointer" onclick="go('journal')"><b>${state.bookings.length}</b><span>คลาสที่จอง</span></div>
    </div>

    ${state.joinedSquads.length ? `
    <div class="sec-title"><h3>ทีมที่เข้าร่วม</h3><a onclick="go('community')">ดูทั้งหมด</a></div>
    ${squads.filter(s=>state.joinedSquads.includes(s.id)).map(sq=>`
      <div class="plan-row">
        <div><div class="pn">${sq.sport} · ${sq.time}</div><div class="pd">${sq.court}</div></div>
      </div>`).join('')}
    ` : ``}

    <div class="quiz-banner invite-banner" onclick="go('referral')" style="margin-top:16px">
      <div class="qi">${ic('users')}</div>
      <div class="qt"><b>ชวนเพื่อนมาเป็นสมาชิก</b><span>รับส่วนลดทั้งคุณและเพื่อนเมื่อสมัคร</span></div>
      <div class="qgo">${ic('arrow')}</div>
    </div>

    <div class="sec-title"><h3>บัญชี</h3></div>
    <div class="acct-list">
      ${acctLinks.map(([icon,label,view])=>`
        <div class="acct-row" onclick="go('${view}')"><div class="ai">${ic(icon)}</div><span>${label}</span>${ic('chevron')}</div>`).join('')}
      <div class="acct-row danger" onclick="showToast('ออกจากระบบแล้ว')"><div class="ai">${ic('logout')}</div><span>ออกจากระบบ</span></div>
    </div>
  </div>` + navbar();
}

function viewCafe(){
  const activeGroup = cafeMenu[state.cafeCat];
  return topbar(true) + `<div class="content" style="position:relative;padding-bottom:${cartCount()?'170px':'108px'}">
    <h1 class="page-title">สั่งมาส่งถึงที่</h1>
    <p class="subline">เลือกรับที่ร้านหรือส่งตามโซนที่คุณอยู่</p>

    <div class="order-toggle cafe-ot">
      <div class="ot-btn ${state.orderType==='pickup'?'active':''}" onclick="setOrderType('pickup')">${ic('home')}รับที่ร้าน</div>
      <div class="ot-btn ${state.orderType==='delivery'?'active':''}" onclick="setOrderType('delivery')">${ic('pin')}ส่งตามโซน</div>
    </div>

    ${state.orderType==='pickup' ? `
    <div class="pickup-note">
      <div class="pn-icon">${ic('home')}</div>
      <div><b>รับที่เคาน์เตอร์ SABAI Café</b><span>พร้อมรับภายใน 8–12 นาที</span></div>
    </div>` : `
    <div class="cat-title2">ส่งถึงโซนไหน</div>
    <div class="zone-scroll">${zones.map(z=>`<div class="zone-chip ${state.zone===z?'sel':''}" onclick="setZone('${z}')">${z}</div>`).join('')}</div>
    `}

    ${state.cafeDiscountAvailable ? `<div class="discount-banner">${ic('tag')}<span>คุณได้รับส่วนลด 20% จากการเข้าร่วมกิจกรรม</span></div>` : ''}

    <div class="cafe-split">
      <div class="cafe-rail">
        ${CAFE_CATS.map((c,i)=>`
          <div class="cafe-rail-item ${state.cafeCat===i?'active':''}" onclick="setCafeCat(${i})">
            <div class="ri">${ic(c.icon)}</div><span>${c.short}</span>
          </div>`).join('')}
      </div>
      <div class="cafe-items">
        <div class="cat-title2" style="margin-top:4px">${activeGroup.cat}</div>
        ${activeGroup.items.map(it=>`
          <div class="item-row">
            <div class="irphoto">${CAFE_ART[it.id]||''}</div>
            <div class="irinfo">
              <div class="irname">${it.name}</div>
              <div class="irtag">${it.tag}</div>
              <div class="irbottom">
                ${state.cafeDiscountAvailable
                  ? `<span class="irprice"><span class="irprice-orig">฿${it.price}</span><span class="irprice-disc">฿${itemPrice(it)}</span></span>`
                  : `<span class="irprice">฿${it.price}</span>`}
                <span class="irkcal">${ic('leaf')}${it.kcal} kcal</span>
              </div>
            </div>
            <div class="qty-ctrl">
              <div class="qty-btn" onclick="addCart('${it.id}',-1)">–</div>
              <div class="qty-num">${state.cart[it.id]||0}</div>
              <div class="qty-btn plus" onclick="addCart('${it.id}',1)">+</div>
            </div>
          </div>`).join('')}
      </div>
    </div>
  </div>
  ${cartCount() ? `<div class="cart-bar" onclick="placeOrder()"><div><b>${cartCount()} รายการ</b><br><span>${state.orderType==='pickup'?'รับที่ร้าน':'ส่งที่ '+state.zone}</span></div><b>สั่งเลย · ฿${cartTotal()}</b></div>` : ''}
  ` + navbar();
}

function viewCafeConfirm(){
  const orderNo = 'CF-'+Math.floor(1000+Math.random()*9000);
  return topbar(false) + `<div class="content">
    <div class="success-wrap">
      <div class="ok-circle cafe-ok">${ic('coffee')}</div>
      <h1 class="page-title" style="text-align:center">สั่งออเดอร์แล้ว</h1>
      <p class="subline" style="text-align:center">หมายเลขออเดอร์ ${orderNo}<br>${state.orderType==='pickup' ? 'พร้อมรับที่เคาน์เตอร์ SABAI Café' : 'กำลังจัดส่งไปที่ '+state.zone}</p>
    </div>
    <button class="btn btn-block btn-green" onclick="go('explore')">กลับไปที่สำรวจ</button>
  </div>` + navbar();
}

/* ---- quiz views ---- */
function viewQuiz(){
  const q = quizQuestions[state.quizStep];
  const pct = Math.round(((state.quizStep)/quizQuestions.length)*100);
  return topbar(true) + `<div class="content">
    <div class="quiz-progress"><span style="width:${pct}%"></span></div>
    <div class="quiz-step">ข้อ ${state.quizStep+1} จาก ${quizQuestions.length}</div>
    <div class="quiz-q">${q.q}</div>
    ${q.opts.map((o,i)=>`
      <div class="q-opt" onclick='answerQuiz(${JSON.stringify(o.ids)})'>
        <div class="q-radio"><i></i></div><span>${o.l}</span>
      </div>`).join('')}
    <button class="btn btn-block btn-outline" style="margin-top:10px" onclick="prevQuizStep()">ย้อนกลับ</button>
  </div>` + navbar();
}
function viewQuizResult(){
  const v = venueById(state.quizResult);
  return topbar(true) + `<div class="content">
    <div class="result-hero">
      <div class="match-icon">${ic('sparkle')}</div>
      <div class="rtag">คอร์สที่เหมาะกับคุณ</div>
      <h2>${v.name}</h2>
      <p>${v.nameTh}</p>
    </div>
    <div class="desc-box">${v.desc}</div>
    <div class="btn-row">
      <button class="btn btn-green" onclick="openVenue('${v.id}')">${v.bookable?'ดูรอบและจอง':'ดูรายละเอียด'}</button>
      <button class="btn btn-outline" onclick="startQuiz()">ทำแบบทดสอบใหม่</button>
    </div>
  </div>` + navbar();
}

/* ---------------- MAIN RENDER ---------------- */
let lastRenderedView = null;
function render(){
  let html = '';
  switch(state.view){
    case 'splash': html = viewSplash(); break;
    case 'login': html = viewLogin(); break;
    case 'today': html = viewToday(); break;
    case 'explore': html = viewExplore(); break;
    case 'venue': html = viewVenue(); break;
    case 'confirm': html = viewConfirm(); break;
    case 'booked': html = viewBooked(); break;
    case 'journal': html = viewJournal(); break;
    case 'notifications': html = viewNotifications(); break;
    case 'packages': html = viewPackages(); break;
    case 'card': html = viewCard(); break;
    case 'community': html = viewCommunity(); break;
    case 'friendProfile': html = viewFriendProfile(); break;
    case 'squadDetail': html = viewSquadDetail(); break;
    case 'postSquad': html = viewPostSquad(); break;
    case 'friendChat': html = viewFriendChat(); break;
    case 'renewPackages': html = viewRenewPackages(); break;
    case 'referral': html = viewReferral(); break;
    case 'orderHistory': html = viewOrderHistory(); break;
    case 'paymentMethods': html = viewPaymentMethods(); break;
    case 'accountSettings': html = viewAccountSettings(); break;
    case 'help': html = viewHelp(); break;
    case 'checkinCode': html = viewCheckinCode(); break;
    case 'fitness': html = viewFitness(); break;
    case 'workoutDetail': html = viewWorkoutDetail(); break;
    case 'routineDetail': html = viewRoutineDetail(); break;
    case 'activeSession': html = viewActiveSession(); break;
    case 'exerciseLibrary': html = viewExerciseLibrary(); break;
    case 'exerciseGroup': html = viewExerciseGroup(); break;
    case 'exerciseDetail': html = viewExerciseDetail(); break;
    case 'routineBuilder': html = viewRoutineBuilder(); break;
    case 'fitCalendar': html = viewFitCalendar(); break;
    case 'statistics': html = viewStatistics(); break;
    case 'measures': html = viewMeasures(); break;
    case 'cafe': html = viewCafe(); break;
    case 'cafeConfirm': html = viewCafeConfirm(); break;
    case 'quiz': html = viewQuiz(); break;
    case 'quizResult': html = viewQuizResult(); break;
    default: html = viewToday();
  }
  const toast = state.toast ? `<div class="toast">${state.toast}</div>` : '';
  const shellEl = document.getElementById('shell');
  shellEl.innerHTML = html + toast;
  if(state.view !== lastRenderedView){
    shellEl.scrollTop = 0;
    lastRenderedView = state.view;
  }
}

render();
</script>
